<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت هزینه‌ها | Expense Tracker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  :root {
    --bg: #0a0a0f;
    --surface: #14141c;
    --surface2: #1c1c28;
    --border: #2a2a3a;
    --text: #e8e8f0;
    --muted: #6b6b7d;
    --accent: #ffc107;
    --accent2: #ff9800;
    --green: #00e676;
    --red: #ff3b5c;
    --blue: #2979ff;
    --purple: #7c4dff;
  }
  
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
  }
  
  .app {
    width: 100%;
    max-width: 1200px;
  }
  
  /* Header */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  
  h1 {
    font-size: 1.6rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  h1 span { color: var(--accent); }
  
  .date-display {
    color: var(--muted);
    font-size: 0.85rem;
  }
  
  /* Stats Grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .stat-card:hover { border-color: var(--accent); }
  
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 4px; height: 100%;
    background: var(--accent);
  }
  .stat-card.green::before { background: var(--green); }
  .stat-card.red::before { background: var(--red); }
  .stat-card.blue::before { background: var(--blue); }
  .stat-card.purple::before { background: var(--purple); }
  
  .stat-label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  
  .stat-value {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }
  .stat-value.purple { color: var(--purple); }
  
  /* Main Layout */
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
  }
  
  /* Form */
  .form-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    height: fit-content;
    position: sticky;
    top: 20px;
  }
  
  .panel-title {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .type-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  
  .type-toggle button {
    padding: 12px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.9rem;
    font-weight: 600;
    transition: all 0.2s;
  }
  .type-toggle button.active {
    background: var(--accent);
    color: #000;
  }
  .type-toggle button:first-child { border-left: 1px solid var(--border); }
  
  .field {
    margin-bottom: 14px;
  }
  .field label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 600;
  }
  .field input,
  .field select {
    width: 100%;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--accent);
  }
  
  .btn-submit {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #000;
    border: none;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }
  .btn-submit:hover {
    background: var(--accent2);
    transform: translateY(-2px);
  }
  .btn-submit:active { transform: translateY(0); }
  
  /* Transactions */
  .list-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
  }
  
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  
  .filter-btn {
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 0.8rem;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
  }
  .filter-btn.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  
  .search-box {
    padding: 8px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.85rem;
    font-family: inherit;
    width: 180px;
  }
  .search-box:focus {
    outline: none;
    border-color: var(--accent);
  }
  
  .transaction-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 500px;
    overflow-y: auto;
    padding-right: 8px;
  }
  .transaction-list::-webkit-scrollbar { width: 6px; }
  .transaction-list::-webkit-scrollbar-track { background: var(--surface2); }
  .transaction-list::-webkit-scrollbar-thumb { background: var(--border); }
  
  .transaction {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: all 0.2s;
    gap: 12px;
    animation: slideIn 0.3s ease;
  }
  
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  
  .transaction:hover {
    border-color: var(--accent);
    transform: translateX(-4px);
  }
  
  .trans-left {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    min-width: 0;
  }
  
  .trans-icon {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    flex-shrink: 0;
  }
  .trans-icon.income { background: rgba(0,230,118,0.15); }
  .trans-icon.expense { background: rgba(255,59,92,0.15); }
  
  .trans-info { min-width: 0; }
  .trans-title {
    font-weight: 600;
    font-size: 0.95rem;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .trans-meta {
    font-size: 0.75rem;
    color: var(--muted);
    display: flex;
    gap: 8px;
  }
  
  .trans-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  
  .trans-amount {
    font-weight: 800;
    font-size: 1rem;
    letter-spacing: -0.5px;
    direction: ltr;
  }
  .trans-amount.income { color: var(--green); }
  .trans-amount.expense { color: var(--red); }
  
  .btn-delete {
    width: 32px;
    height: 32px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-delete:hover {
    background: var(--red);
    color: #fff;
    border-color: var(--red);
  }
  
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 3rem; margin-bottom: 12px; }
  
  /* Chart */
  .chart-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    margin-top: 20px;
  }
  
  .chart-container {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 180px;
    padding: 20px 0;
  }
  
  .bar-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    height: 100%;
    justify-content: flex-end;
  }
  
  .bar {
    width: 100%;
    max-width: 50px;
    background: linear-gradient(180deg, var(--accent), var(--accent2));
    transition: height 0.5s ease;
    min-height: 2px;
  }
  
  .bar-label {
    font-size: 0.7rem;
    color: var(--muted);
    text-align: center;
  }
  
  .bar-value {
    font-size: 0.7rem;
    color: var(--accent);
    font-weight: 700;
  }
  
  /* Actions */
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
  
  .btn-action {
    flex: 1;
    min-width: 120px;
    padding: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: inherit;
    transition: all 0.2s;
  }
  .btn-action:hover { border-color: var(--accent); color: var(--accent); }
  .btn-action.danger:hover { border-color: var(--red); color: var(--red); }
  
  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 14px 24px;
    font-size: 0.9rem;
    z-index: 999;
    transition: transform 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  
  @media (max-width: 600px) {
    body { padding: 12px; }
    h1 { font-size: 1.3rem; }
    .stat-value { font-size: 1.2rem; }
    .form-panel, .list-panel, .chart-panel { padding: 16px; }
    .form-panel { position: static; }
    .search-box { width: 100%; }
    .list-header { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>💰 مدیریت <span>هزینه‌ها</span></h1>
    <div class="date-display" id="dateDisplay"></div>
  </header>

  <!-- آمار -->
  <div class="stats">
    <div class="stat-card green">
      <div class="stat-label">کل درآمد</div>
      <div class="stat-value green" id="totalIncome">۰</div>
    </div>
    <div class="stat-card red">
      <div class="stat-label">کل هزینه</div>
      <div class="stat-value red" id="totalExpense">۰</div>
    </div>
    <div class="stat-card blue">
      <div class="stat-label">موجودی</div>
      <div class="stat-value blue" id="balance">۰</div>
    </div>
    <div class="stat-card purple">
      <div class="stat-label">تعداد تراکنش</div>
      <div class="stat-value purple" id="totalCount">۰</div>
    </div>
  </div>

  <div class="main-grid">
    <!-- فرم -->
    <div class="form-panel">
      <div class="panel-title">➕ تراکنش جدید</div>

      <div class="type-toggle">
        <button id="btnExpense" class="active">💸 هزینه</button>
        <button id="btnIncome">💵 درآمد</button>
      </div>

      <div class="field">
        <label>عنوان</label>
        <input type="text" id="title" placeholder="مثلاً: خرید نان" maxlength="50">
      </div>

      <div class="field">
        <label>مبلغ (تومان)</label>
        <input type="number" id="amount" placeholder="مثلاً: 50000" min="0">
      </div>

      <div class="field">
        <label>دسته‌بندی</label>
        <select id="category">
          <option value="خوراک">🍔 خوراک</option>
          <option value="حمل‌ونقل">🚗 حمل‌ونقل</option>
          <option value="سرگرمی">🎮 سرگرمی</option>
          <option value="خرید">🛍️ خرید</option>
          <option value="قبض">📄 قبض</option>
          <option value="درمان">💊 درمان</option>
          <option value="حقوق">💼 حقوق</option>
          <option value="سایر">📦 سایر</option>
        </select>
      </div>

      <div class="field">
        <label>تاریخ</label>
        <input type="date" id="date">
      </div>

      <button class="btn-submit" id="btnAdd">ثبت تراکنش</button>

      <div class="actions">
        <button class="btn-action" id="btnExport">📥 خروجی CSV</button>
        <button class="btn-action danger" id="btnClear">🗑️ پاک کردن همه</button>
      </div>
    </div>

    <!-- لیست -->
    <div class="list-panel">
      <div class="list-header">
        <div class="panel-title" style="border:none; margin:0; padding:0;">📋 تراکنش‌ها</div>
        <input type="text" class="search-box" id="search" placeholder="🔍 جستجو...">
      </div>

      <div class="filters" style="margin-bottom:16px;">
        <button class="filter-btn active" data-filter="all">همه</button>
        <button class="filter-btn" data-filter="income">درآمد</button>
        <button class="filter-btn" data-filter="expense">هزینه</button>
      </div>

      <div class="transaction-list" id="list"></div>
    </div>
  </div>

  <!-- نمودار -->
  <div class="chart-panel">
    <div class="panel-title">📊 هزینه بر اساس دسته‌بندی</div>
    <div class="chart-container" id="chart"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Expense Tracker - مدیریت هزینه‌ها
   بدون دیتابیس - فقط localStorage
   ============================================================ */

const STORAGE_KEY = 'expense_tracker_data_v1';
let transactions = [];
let currentType = 'expense';
let currentFilter = 'all';
let searchQuery = '';

// بارگذاری از localStorage
function loadData() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    transactions = data ? JSON.parse(data) : [];
  } catch(e) {
    transactions = [];
  }
}

// ذخیره در localStorage
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
  } catch(e) {
    toast('⚠️ خطا در ذخیره‌سازی', 'error');
  }
}

// تبدیل اعداد به فارسی
function toFa(num) {
  const fa = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
  return String(Math.round(num)).replace(/\d/g, d => fa[d]);
}

// فرمت مبلغ
function formatMoney(n) {
  const abs = Math.abs(n);
  let formatted = abs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return toFa(formatted) + ' تومان';
}

// تاریخ امروز
function todayISO() {
  return new Date().toISOString().split('T')[0];
}

// تاریخ به فارسی
function formatDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return toFa(y) + '/' + toFa(m) + '/' + toFa(d);
}

// نمایش toast
let toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = type === 'error' ? 'var(--red)' : type === 'success' ? 'var(--green)' : 'var(--accent)';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// رندر همه چیز
function render() {
  renderStats();
  renderList();
  renderChart();
}

// آمار
function renderStats() {
  const income = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const expense = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const balance = income - expense;

  document.getElementById('totalIncome').textContent = formatMoney(income);
  document.getElementById('totalExpense').textContent = formatMoney(expense);
  document.getElementById('balance').textContent = formatMoney(balance);
  document.getElementById('balance').style.color = balance >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('totalCount').textContent = toFa(transactions.length);
}

// لیست
function renderList() {
  const list = document.getElementById('list');
  let filtered = transactions.slice().sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.id - a.id);

  if (currentFilter === 'income') filtered = filtered.filter(t => t.type === 'income');
  if (currentFilter === 'expense') filtered = filtered.filter(t => t.type === 'expense');
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    filtered = filtered.filter(t => t.title.toLowerCase().includes(q) || t.category.includes(q));
  }

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">📭</div>
      <div>${searchQuery || currentFilter !== 'all' ? 'نتیجه‌ای یافت نشد' : 'هنوز تراکنشی ثبت نشده'}</div>
    </div>`;
    return;
  }

  const catIcons = {
    'خوراک':'🍔','حمل‌ونقل':'🚗','سرگرمی':'🎮','خرید':'🛍️',
    'قبض':'📄','درمان':'💊','حقوق':'💼','سایر':'📦'
  };

  list.innerHTML = filtered.map(t => `
    <div class="transaction">
      <div class="trans-left">
        <div class="trans-icon ${t.type}">${catIcons[t.category] || '📦'}</div>
        <div class="trans-info">
          <div class="trans-title">${escapeHtml(t.title)}</div>
          <div class="trans-meta">
            <span>${t.category}</span>
            <span>•</span>
            <span>${formatDate(t.date)}</span>
          </div>
        </div>
      </div>
      <div class="trans-right">
        <div class="trans-amount ${t.type}">
          ${t.type === 'income' ? '+' : '−'} ${formatMoney(t.amount)}
        </div>
        <button class="btn-delete" data-id="${t.id}" title="حذف">✕</button>
      </div>
    </div>
  `).join('');

  // دکمه‌های حذف
  list.querySelectorAll('.btn-delete').forEach(btn => {
    btn.addEventListener('click', () => deleteTransaction(parseInt(btn.dataset.id)));
  });
}

// escape HTML
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// نمودار
function renderChart() {
  const chart = document.getElementById('chart');
  const catTotals = {};
  transactions.filter(t => t.type === 'expense').forEach(t => {
    catTotals[t.category] = (catTotals[t.category] || 0) + t.amount;
  });

  const entries = Object.entries(catTotals).sort((a, b) => b[1] - a[1]).slice(0, 7);

  if (entries.length === 0) {
    chart.innerHTML = '<div style="width:100%; text-align:center; color:var(--muted); padding:40px;">داده‌ای برای نمایش وجود ندارد</div>';
    return;
  }

  const max = Math.max(...entries.map(e => e[1]));

  chart.innerHTML = entries.map(([cat, val]) => {
    const pct = (val / max) * 100;
    return `
      <div class="bar-wrapper">
        <div class="bar-value">${toFa((val/1000).toFixed(0))}K</div>
        <div class="bar" style="height:${pct}%"></div>
        <div class="bar-label">${cat}</div>
      </div>
    `;
  }).join('');
}

// افزودن
function addTransaction() {
  const title = document.getElementById('title').value.trim();
  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('category').value;
  const date = document.getElementById('date').value || todayISO();

  if (!title) { toast('❌ عنوان را وارد کنید', 'error'); return; }
  if (!amount || amount <= 0) { toast('❌ مبلغ معتبر وارد کنید', 'error'); return; }

  transactions.push({
    id: Date.now(),
    type: currentType,
    title,
    amount,
    category,
    date
  });

  saveData();
  render();

  // پاک کردن فرم
  document.getElementById('title').value = '';
  document.getElementById('amount').value = '';
  document.getElementById('title').focus();

  toast('✅ تراکنش ثبت شد', 'success');
}

// حذف
function deleteTransaction(id) {
  transactions = transactions.filter(t => t.id !== id);
  saveData();
  render();
  toast('🗑️ حذف شد');
}

// خروجی CSV
function exportCSV() {

  let csv = '\uFEFF'; // BOM برای Excel فارسی
